<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServerEmD | AI Emotion Detector</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            background: rgba(20, 25, 40, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 42px;
            padding: 28px 32px 32px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 680px;
            color: #eef2ff;
        }
        h1 {
            margin: 0 0 20px 0;
            font-weight: 500;
            font-size: 1.8rem;
            letter-spacing: -0.01em;
            color: #b9c8ff;
        }
        .input-area {
            margin-bottom: 24px;
        }
        textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            background: #0b0e14;
            border: 1px solid #2a3450;
            border-radius: 24px;
            padding: 18px 20px;
            color: #eef2ff;
            font-size: 1.05rem;
            line-height: 1.5;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
        }
        textarea:focus {
            border-color: #5a74c0;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 0 0 3px rgba(90, 116, 192, 0.25);
        }
        textarea::placeholder {
            color: #5a6788;
        }
        .result-area {
            background: #131a2b;
            border-radius: 28px;
            padding: 22px 24px;
            margin-bottom: 26px;
            border: 1px solid #2a3450;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.3);
            position: relative;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .emotion-line {
            font-size: 2.1rem;
            font-weight: 600;
            line-height: 1.2;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(110, 150, 255, 0.4);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            word-break: break-word;
        }
        .confidence-label {
            font-size: 1.2rem;
            font-weight: 400;
            color: #a3b6ff;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .confidence-label .badge {
            background: #253055;
            border-radius: 50px;
            padding: 4px 14px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #d0dcff;
            border: 1px solid #3d4d7a;
        }
        .overlay-loading {
            position: absolute;
            inset: 0;
            background: rgba(8, 12, 22, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            transition: opacity 0.2s;
        }
        .spinner {
            width: 52px;
            height: 52px;
            border: 5px solid rgba(160, 180, 255, 0.15);
            border-top: 5px solid #7b9aff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: #b7c6ff;
            font-weight: 400;
            letter-spacing: 1px;
            font-size: 0.95rem;
            background: rgba(0,0,0,0.3);
            padding: 6px 18px;
            border-radius: 40px;
        }
        .controls {
            display: flex;
            gap: 18px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background: #2d3d6b;
            border: none;
            border-radius: 60px;
            padding: 16px 34px;
            font-size: 1.2rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            box-shadow: 0 8px 20px -6px #0a0e18, 0 0 0 1px #40548b inset;
            letter-spacing: 0.3px;
            flex: 1 0 auto;
        }
        button:hover:not(:disabled) {
            background: #3b4f8a;
            box-shadow: 0 12px 26px -8px #0f1424, 0 0 0 1px #6376b0 inset;
            transform: scale(1.01);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.6);
            box-shadow: none;
        }
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Emotion Detector</h1>

        <div class="input-area">
            <textarea id="textInput" placeholder="Type something and press Enter…"></textarea>
        </div>

        <div class="result-area" id="resultArea">
            <div id="loadingOverlay" class="overlay-loading fade-out">
                <div class="spinner"></div>
                <div class="loading-text">Loading…</div>
            </div>
            <div class="emotion-line" id="emotionDisplay">—</div>
            <div class="confidence-label" id="confidenceDisplay">
                <span>Confidence</span>
                <span class="badge" id="confidenceBadge">—</span>
            </div>
        </div>

        <div class="controls">
            <button id="detectBtn">Enter</button>
        </div>
    </div>

    <script src="https://serveremd.github.io/models/emd-1-0.js"></script>
    <script>
        (function(){
            const textInput = document.getElementById('textInput');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const emotionDisplay = document.getElementById('emotionDisplay');
            const confidenceBadge = document.getElementById('confidenceBadge');
            const detectBtn = document.getElementById('detectBtn');

            let isDetecting = false;

            function showLoading(show) {
                if (show) {
                    loadingOverlay.classList.remove('fade-out');
                } else {
                    loadingOverlay.classList.add('fade-out');
                }
            }

            function displayResult(emotion, confidence) {
                emotionDisplay.textContent = emotion;
                confidenceBadge.textContent = window.EmD ? window.EmD.getLabel(confidence) : "—";
            }

            function setButtonEnabled(enabled) {
                detectBtn.disabled = !enabled;
            }

            async function detectEmotion() {
                if (isDetecting) return;

                const text = textInput.value.trim();
                if (!text) return;

                if (!window.EmD) {
                    emotionDisplay.textContent = "Error";
                    confidenceBadge.textContent = "—";
                    return;
                }

                isDetecting = true;
                setButtonEnabled(false);

                emotionDisplay.textContent = '—';
                confidenceBadge.textContent = '—';
                showLoading(true);

                try {
                    const result = await window.EmD.detectAsync(text);
                    showLoading(false);
                    displayResult(result.emotion, result.confidence);
                } catch (err) {
                    console.error(err);
                    showLoading(false);
                    emotionDisplay.textContent = 'Error';
                    confidenceBadge.textContent = '—';
                } finally {
                    isDetecting = false;
                    setButtonEnabled(true);
                }
            }

            detectBtn.addEventListener('click', detectEmotion);

            textInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    detectEmotion();
                }
            });

            textInput.focus();
        })();
    </script>
</body>
</html>
